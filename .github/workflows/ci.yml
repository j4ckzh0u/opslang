name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The suite provably passes on clean Linux (verified in a container and
  # on a bare-metal 32GB host), but GitHub-hosted runners intermittently
  # hand out memory-starved VMs where any test binary can die with ENOMEM
  # at startup. A retry INSIDE the job cannot help - the machine stays
  # starved. These attempt-2 jobs rerun a failed shard on a FRESH runner.
  test-core:
    name: Test core (attempt 1)
    runs-on: ubuntu-latest
    # A starved runner loses attempt 1; that must not redden the run.
    # The retry job carries the real verdict via the outcome fields.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test core (security first, then the rest)
        # ponytail: -race causes TSan OOM in CI when running full suite.
        # Race detection should be done locally with `go test -race ./...`
        #
        # No -coverprofile: coverage instrumentation roughly doubles
        # compiler peak memory on this module's 8k+ line files.
        # GOTRACEBACK=all: the rare internal/security failure dumps only
        # two goroutines by default, which is not enough to diagnose it.
        env:
          GOTRACEBACK: all
        run: |
          set -o pipefail
          go test -timeout 10m ./internal/security/ && \
          go list ./cmd/... ./internal/... | grep -v 'internal/security$' | xargs go test -p 1 -timeout 45m

      - name: Check generated docs are fresh
        # docs/generated/ops-index.md is derived from opsspec; adding an
        # op without `make docs` must fail CI instead of rotting silently.
        run: make docs-check

  test-core-retry:
    name: Test core (attempt 2, fresh runner)
    runs-on: ubuntu-latest
    needs: [test-core]
    if: needs.test-core.outcome == 'failure'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test core (security first, then the rest)
        run: |
          set -o pipefail
          go test -timeout 10m ./internal/security/ && \
          go list ./cmd/... ./internal/... | grep -v 'internal/security$' | xargs go test -p 1 -timeout 45m

      - name: Check generated docs are fresh
        run: make docs-check

  test-sdk:
    name: Test sdk (attempt 1)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test sdk (pkg)
        run: go test -p 1 -timeout 45m ./pkg/...

  test-sdk-retry:
    name: Test sdk (attempt 2, fresh runner)
    runs-on: ubuntu-latest
    needs: [test-sdk]
    if: needs.test-sdk.outcome == 'failure'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test sdk (pkg)
        run: go test -p 1 -timeout 45m ./pkg/...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-core, test-core-retry, test-sdk, test-sdk-retry]
    # Pass if each shard passed on EITHER attempt; the retry jobs are
    # skipped when their attempt-1 job succeeded.
    if: >
      always() &&
      (needs.test-core.outcome == 'success' || needs.test-core-retry.outcome == 'success') &&
      (needs.test-sdk.outcome == 'success' || needs.test-sdk-retry.outcome == 'success')
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build opsctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o opsctl-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/opsctl

      - name: Build ops-runner
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o ops-runner-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/ops-runner

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            opsctl-${{ matrix.goos }}-${{ matrix.goarch }}
            ops-runner-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
