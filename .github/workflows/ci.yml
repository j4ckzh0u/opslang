name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two shards on separate runners: the full suite on one machine
        # sits right at the runner's memory ceiling and OOM-flakes
        # ("runtime: cannot allocate memory" in internal/security).
        # Halving the per-machine package set makes each peak safe.
        shard: [core, sdk]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test core (cmd + internal)
        if: matrix.shard == 'core'
        # ponytail: -race causes TSan OOM in CI when running full suite.
        # Race detection should be done locally with `go test -race ./...`
        # No -coverprofile: coverage instrumentation roughly doubles
        # compiler peak memory on this module's 8k+ line files and pushed
        # runners into ENOMEM. Local coverage: make coverage.
        # The retry is nearly free: go test caches passing packages, so a
        # rerun re-executes only what failed. Absorbs rare runner-side
        # OOM flakes; a deterministic failure still fails twice.
        run: |
          go test -p 1 -timeout 45m ./cmd/... ./internal/... || \
          go test -p 1 -timeout 45m ./cmd/... ./internal/...

      - name: Test sdk (pkg)
        if: matrix.shard == 'sdk'
        run: |
          go test -p 1 -timeout 45m ./pkg/... || \
          go test -p 1 -timeout 45m ./pkg/...

      - name: Check generated docs are fresh
        # docs/generated/ops-index.md is derived from opsspec; adding an
        # op without `make docs` must fail CI instead of rotting silently.
        run: make docs-check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build opsctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o opsctl-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/opsctl

      - name: Build ops-runner
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o ops-runner-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/ops-runner

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            opsctl-${{ matrix.goos }}-${{ matrix.goarch }}
            ops-runner-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
