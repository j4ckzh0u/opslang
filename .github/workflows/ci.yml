name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The suite provably passes on clean Linux (verified in a container and
  # on a bare-metal 32GB host), but GitHub-hosted runners intermittently
  # hand out memory-starved VMs where any test binary can die with ENOMEM
  # at startup. A retry INSIDE the job cannot help - the machine stays
  # starved. Attempt-2 jobs rerun a failed shard on a FRESH runner.
  #
  # Verdict plumbing: needs.*.outcome is UNRELIABLE through
  # continue-on-error (observed masked), so each shard reports an explicit
  # `passed` output computed from its test step's outcome. attempt-2 jobs
  # carry no masking: if they fail too, the run goes red for real.
  test-core:
    name: Test core (attempt 1)
    runs-on: ubuntu-latest
    # A starved runner losing attempt 1 must not redden the run.
    continue-on-error: true
    outputs:
      passed: ${{ steps.verdict.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test core (security first, then docs freshness)
        id: tests
        # Capture the loss without aborting before the verdict step.
        continue-on-error: true
        # ponytail: -race causes TSan OOM in CI when running full suite;
        # do it locally. No -coverprofile: coverage instrumentation
        # roughly doubles compiler peak memory on this module's 8k+ line
        # files. GOTRACEBACK=all keeps full goroutine dumps for the rare
        # internal/security failure.
        env:
          GOTRACEBACK: all
        run: |
          set -o pipefail
          go test -timeout 10m ./internal/security/ && \
          go list ./cmd/... ./internal/... | grep -v 'internal/security$' | xargs go test -p 1 -timeout 45m && \
          make docs-check

      - name: Record verdict
        id: verdict
        if: always()
        run: echo "passed=${{ steps.tests.outcome == 'success' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"

  test-core-retry:
    name: Test core (attempt 2, fresh runner)
    runs-on: ubuntu-latest
    needs: [test-core]
    if: needs.test-core.outputs.passed != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test core (security first, then docs freshness)
        env:
          GOTRACEBACK: all
        run: |
          set -o pipefail
          go test -timeout 10m ./internal/security/ && \
          go list ./cmd/... ./internal/... | grep -v 'internal/security$' | xargs go test -p 1 -timeout 45m && \
          make docs-check

  test-sdk:
    name: Test sdk (attempt 1)
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      passed: ${{ steps.verdict.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test sdk (pkg)
        id: tests
        continue-on-error: true
        run: go test -p 1 -timeout 45m ./pkg/...

      - name: Record verdict
        id: verdict
        if: always()
        run: echo "passed=${{ steps.tests.outcome == 'success' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"

  test-sdk-retry:
    name: Test sdk (attempt 2, fresh runner)
    runs-on: ubuntu-latest
    needs: [test-sdk]
    if: needs.test-sdk.outputs.passed != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test sdk (pkg)
        run: go test -p 1 -timeout 45m ./pkg/...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-core, test-core-retry, test-sdk, test-sdk-retry]
    # Pass only when each chain truly succeeded: either attempt 1 passed,
    # or attempt 2 ran and passed. A double failure blocks here AND leaves
    # the red attempt-2 job visible on the run.
    if: >
      always() &&
      (needs.test-core.outputs.passed == 'true' || needs.test-core-retry.conclusion == 'success') &&
      (needs.test-sdk.outputs.passed == 'true' || needs.test-sdk-retry.conclusion == 'success')
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build opsctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o opsctl-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/opsctl

      - name: Build ops-runner
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o ops-runner-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/ops-runner

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            opsctl-${{ matrix.goos }}-${{ matrix.goarch }}
            ops-runner-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
