run:
  timeout: 5m
  issues-exit-code: 1

linters:
  enable:
    - govet
    - unused
  disable:
    - errcheck  # 暂时禁用，后续逐步修复

issues:
  exclude-rules:
    # 排除测试文件的某些检查
    - path: _test\.go
      linters:
        - govet

    # 排除生成的代码
    - path: pkg/compiler/compiler.go
      linters:
        - unused

linters-settings:
  govet:
    check-shadowing: false
